plugins {
    id 'com.android.application'
}

def dotVersion = file('src/main/java/co/dothq/browser/config/version.txt').text.trim()

android {
    namespace = "co.dothq.browser"
    // GeckoView 160 is compiled against Android 17 QPR (API 37.2).
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = "co.dothq.browser"
        // GeckoView now requires Android 8.0 (API 26) or newer.
        minSdk = 26
        // Kept at 32 so runtime behaviour is unchanged (35+ forces edge-to-edge, etc.).
        targetSdk = 32
        versionCode = 2
        versionName = dotVersion

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // The on-device assistant (llama.cpp). 64-bit only: phones that can run a language
        // model are all 64-bit, and llama.cpp doesn't target 32-bit ARM.
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    ndkVersion = "30.0.16248370"

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = "3.31.6"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // GeckoView ships native code for every CPU type (~260 MB universal). Also build one APK
    // per ABI so each phone only downloads what it can run; arm64-v8a covers modern phones.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Kotlin's jvmTarget follows this automatically with built-in Kotlin.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        // Replaces android:extractNativeLibs="true" from the manifest.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            // Forward slashes so this also works on Linux/macOS (CI).
            assets.srcDir 'src/main/java/co/dothq/browser/config'
        }
    }
}

dependencies {
    def gecko_version = "160.0.20261104181552"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "org.mozilla.geckoview:geckoview:$gecko_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
