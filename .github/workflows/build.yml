name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # llama.cpp (the on-device assistant) is a submodule.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # GeckoView 160 compiles against the Android 17 QPR platform (API 37.2).
          # NDK + CMake build llama.cpp for the on-device assistant.
          packages: "platforms;android-37.2 build-tools;36.0.0 platform-tools ndk;30.0.16248370 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: echo "VERSION=$(cat app/src/main/java/co/dothq/browser/config/version.txt | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APKs
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Name APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-debug$//')
            cp "$f" "dist/dot-${VERSION}-${GITHUB_RUN_NUMBER}-${abi}-debug.apk"
          done
          ls -lh dist

      - name: Upload arm64 APK (most phones)
        uses: actions/upload-artifact@v4
        with:
          name: dot-${{ env.VERSION }}-${{ github.run_number }}-arm64-v8a
          path: dist/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: dot-${{ env.VERSION }}-${{ github.run_number }}-all
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    name: Release
    needs: build
    # Push a tag like v0.1.0 to publish a GitHub release with the APKs attached.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dot-*-all
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Dot ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
