name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - app/**
      - gradle/**
    branches:
      - nightly

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Release APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set variables
        run: |
          VER=$(cat app/src/main/java/co/dothq/browser/config/version.txt)
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Rename APK
        run: mv apk/app-debug.apk "apk/dot-${{ env.VERSION }}-${{ github.run_number }}-${{ github.ref_name }}-debug.apk"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ROBOT_TOKEN }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Release v${{ env.VERSION }}-${{ github.run_number }}
          files: apk/*.apk
